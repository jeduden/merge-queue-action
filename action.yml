name: merge-queue
description: >-
  Bors-style merge queue with batching and bisection. Merges PRs into
  the batch branch locally via `git merge` so custom merge drivers
  (.gitattributes + merge.<name>.driver) take effect. The action
  configures git identity and rewrites `origin` to use the supplied
  token, so the only workflow-side step required before it is
  `actions/checkout` with `fetch-depth: 0`.

inputs:
  token:
    description: >-
      GitHub token with contents:write, pull-requests:write,
      actions:write, and issues:write permissions
    required: true
  ci_workflow:
    description: >-
      Workflow file in this repository to run against the batch branch;
      must support workflow_dispatch (e.g. .github/workflows/ci.yml)
    required: true
  batch_size:
    description: Max PRs per batch
    default: "5"
  queue_label:
    description: Label that enqueues a PR
    default: queue
  ci_wait_minutes:
    description: >-
      How long (in minutes) to wait for the dispatched CI run on a batch
      branch to complete before treating the wait as failed and requeueing
      the batch. Size this above your slowest CI run: a too-small value
      makes every batch time out and charges the requeue cap until the
      PRs are marked failed without CI ever failing. Must be a positive
      integer; invalid values fall back to the default with a warning.
    default: "60"
  max_requeues:
    description: >-
      Max times a single PR is requeued before the queue gives up and
      marks it failed. Bounds every retry path so a deterministic failure
      (e.g. a permission error or an always-failing check) cannot
      re-trigger the workflow forever. Must be a positive integer; zero,
      negative, or non-numeric values fall back to the default (with a
      warning in the run log).
    default: "10"
  dry_run:
    description: Log intent without mutating
    default: "false"
  batch_prs:
    description: >-
      PR numbers to process explicitly. Accepts a JSON array of integers
      (e.g. "[187]" or "[181,187]") or a single integer string (e.g. "187").
      When provided in normal (non-bisect) mode via workflow_dispatch, those
      PRs are fetched directly by number and processed without requiring them
      to have the queue label — useful as a fallback for conflicted PRs whose
      pull_request:labeled event did not trigger a workflow run.
      In bisect mode this field is set automatically by the action itself.
    default: ""
  bisect:
    description: >-
      Run in bisect mode (set automatically via workflow_dispatch)
    default: "false"
  git_user_email:
    description: >-
      Email used for the merge commit author/committer. Set on the
      local repo via `git config user.email` before merging.
    default: merge-queue@users.noreply.github.com
  git_user_name:
    description: >-
      Name used for the merge commit author/committer. Set on the
      local repo via `git config user.name` before merging.
    default: merge-queue-bot

runs:
  using: node24
  main: dist/index.js
  # Scrubs the token-embedded origin URL from .git/config after the job's
  # other steps, so steps following this action cannot read the
  # merge-queue token. Runs even when the main step failed.
  post: dist/cleanup.js
